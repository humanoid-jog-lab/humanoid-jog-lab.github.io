[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sailor-sdk"
version = "0.1.0"
description = "Standalone Python SDK for Sailor R1 Pro nullspace control and ROS2 interfaces."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "dq_vizlab" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
