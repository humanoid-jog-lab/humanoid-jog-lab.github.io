name: Build and Deploy Frontend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 需要完整的 git 历史用于部署

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: Install dependencies (skip build scripts)
      run: npm install --ignore-scripts
      env:
        # 跳过 rclnodejs 的构建
        SKIP_RCLNODEJS_BUILD: true

    - name: Build frontend
      run: npm run build
    
    - name: Debug info
      run: |
        echo "=== Debug Information ==="
        echo "Event name: ${{ github.event_name }}"
        echo "Ref: ${{ github.ref }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Repository: ${{ github.repository }}"
        echo ""
    
    - name: Check build output
      run: |
        echo "Build output directory contents:"
        ls -la dist/ || echo "dist directory not found"
        echo ""
        echo "Dist directory size:"
        du -sh dist/ || echo "Cannot calculate size"
        echo ""
        echo "First few files in dist:"
        ls -la dist/ | head -20 || echo "Cannot list files"
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: false
        force_orphan: false
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
